<text x="1510" y="540" font-size="12.5" font-weight="bold" fill="#222" xml:space="preserve">Regras de negócio (por cadastro)</text>
<text x="1510" y="557" font-size="12.5" fill="#222" xml:space="preserve">R1: ônibus ACESSÍVEL a ≤ limiar → aviso "está chegando"</text>
<text x="1510" y="574" font-size="12.5" fill="#222" xml:space="preserve">      (+ alerta se antes passa um não acessível)</text>
<text x="1510" y="591" font-size="12.5" fill="#222" xml:space="preserve">R2: próximo ônibus NÃO acessível a ≤ limiar → alerta com</text>
<text x="1510" y="608" font-size="12.5" fill="#222" xml:space="preserve">      tempo até o próximo acessível</text>
<text x="1510" y="625" font-size="12.5" fill="#222" xml:space="preserve">R3: nada perto → aguardando (sem envio)</text>
<text x="1510" y="642" font-size="12.5" fill="#222" xml:space="preserve">Sem repetição: mesmo aviso 1x a cada 90 min;</text>
<text x="1510" y="659" font-size="12.5" fill="#222" xml:space="preserve">alerta R2 no máx. 1x a cada 15 min por cadastro</text>
<text x="40" y="705" font-size="12" fill="#555">Legenda: ◯ evento (início com relógio = timer · fim · fim com raio = erro) · ◇✕ decisão exclusiva · tarefa de script / serviço (API) / envio (e-mail) · ||| = repetição sobre uma coleção</text>
</svg>